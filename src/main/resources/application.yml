app:
  time-zone: Asia/Seoul

spring:
  application:
    name: faithlog-backend
  profiles:
    active: local
  jackson:
    time-zone: Asia/Seoul
  datasource:
    hikari:
      connection-init-sql: SET TIME ZONE 'Asia/Seoul'
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:0}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:}
      mail.smtp.starttls.enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:}
      mail.smtp.starttls.required: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:}
      mail.smtp.connectiontimeout: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT:}
      mail.smtp.timeout: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT:}
      mail.smtp.writetimeout: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT:}

server:
  port: ${PORT:${SERVER_PORT:8080}}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

faithlog:
  api-prefix: /api/v1
  auth:
    email-verification-required: ${FAITHLOG_AUTH_EMAIL_VERIFICATION_REQUIRED:false}
    verification-hmac-secret: ${AUTH_VERIFICATION_HMAC_SECRET:}
    email-provider:
      enabled: ${FAITHLOG_EMAIL_PROVIDER_ENABLED:false}
    email-dispatch:
      cloud-tasks-enabled: ${FAITHLOG_EMAIL_DISPATCH_CLOUD_TASKS_ENABLED:false}
      worker-enabled: ${FAITHLOG_EMAIL_DISPATCH_WORKER_ENABLED:false}
      encryption-key: ${AUTH_EMAIL_DISPATCH_ENCRYPTION_KEY:}
      project-id: ${FAITHLOG_EMAIL_DISPATCH_PROJECT_ID:}
      location: ${FAITHLOG_EMAIL_DISPATCH_LOCATION:}
      queue-id: ${FAITHLOG_EMAIL_DISPATCH_QUEUE_ID:}
      worker-url: ${FAITHLOG_EMAIL_DISPATCH_WORKER_URL:}
      oidc-service-account-email: ${FAITHLOG_EMAIL_DISPATCH_OIDC_SERVICE_ACCOUNT_EMAIL:}
      oidc-audience: ${FAITHLOG_EMAIL_DISPATCH_OIDC_AUDIENCE:}
  mail:
    from-name: ${FAITHLOG_MAIL_FROM_NAME:}
    from-email: ${FAITHLOG_MAIL_FROM_EMAIL:}
  jwt:
    secret: ${JWT_SECRET}
    access-token-validity-seconds: ${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:1800}
    refresh-token-validity-seconds: ${JWT_REFRESH_TOKEN_VALIDITY_SECONDS:1209600}
  firebase:
    config-path: ${FIREBASE_CONFIG_PATH:}
    config-json: ${FIREBASE_CONFIG_JSON:}
  scheduler:
    enabled: ${FAITHLOG_SCHEDULER_ENABLED:true}
    poll-auto-create-delay-ms: ${FAITHLOG_POLL_AUTO_CREATE_DELAY_MS:60000}
    coffee-poll-close-delay-ms: ${FAITHLOG_COFFEE_POLL_CLOSE_DELAY_MS:60000}
    data-retention-cleanup-cron: ${FAITHLOG_DATA_RETENTION_CLEANUP_CRON:0 30 4 * * *}
    fcm-token-cleanup-cron: ${FAITHLOG_FCM_TOKEN_CLEANUP_CRON:0 20 3 * * *}
    devotion-missing-cron: ${FAITHLOG_DEVOTION_MISSING_CRON:0 0 11 * * *}
    poll-missing-delay-ms: ${FAITHLOG_POLL_MISSING_DELAY_MS:60000}
    payment-unpaid-cron: ${FAITHLOG_PAYMENT_UNPAID_CRON:0 0 12 * * *}
    pending-notification-recovery-delay-ms: ${FAITHLOG_PENDING_NOTIFICATION_RECOVERY_DELAY_MS:60000}
